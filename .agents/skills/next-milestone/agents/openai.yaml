interface:
  display_name: "Next Milestone"
  short_description: "Choose the next concrete product milestone."
  default_prompt: "Use this repo-local skill to determine the next concrete product milestone or wedge. Recover context, apply the source hierarchy, distinguish authority context from live signals, classify the recommendation into exactly one of the six milestone families, classify PLAN.md and ORCH_PLAN.md by authority-file state, and decide the next artifact kind plus whether /autoplan is actually ready now. Recommend the milestone itself, not the prerequisite planning step. If the milestone is still gated by a plan artifact, mark that in readiness and handoff rather than turning planning into the recommendation. Distinguish a finished ORCH plan from a current PLAN draft that may have been authored by that finished planning run and may now be reviewable as-is. Do not promote a future trigger-table row or M41 gate branch while `required_next_action` still points at the current planning artifact or the closeout still says implementation is gated. Recommend one honest next move with evidence and a concrete handoff, not just a milestone label."
