interface:
  display_name: "Next Milestone"
  short_description: "Choose the next concrete product milestone."
  default_prompt: "Use this repo-local skill to determine the next concrete product milestone or wedge. Recover context, apply the source hierarchy, distinguish authority context from live signals, classify the recommendation into exactly one of the six milestone families, classify repo-root PLAN.md and ORCH_PLAN.md as completed authority context inputs when they exist, and decide the next artifact kind plus whether /autoplan is actually ready now. ORCH_PLAN.md is always an execution contract in this repo, and by the time /next-milestone runs both repo-root PLAN.md and ORCH_PLAN.md are completed context rather than active work targets. Recommend the milestone itself, not the prerequisite planning step. If the milestone is still gated by a plan artifact, mark that in readiness and handoff rather than turning planning into the recommendation. The recommendation sentence must keep the winning wedge as the subject; mention any artifact only as a gate on that wedge, not as the main action. If the truthful immediate next tool is `/gstack-autoplan` because it can create or tighten the next milestone's gstack design doc from completed authority context, say so directly and set `Next artifact kind` / `Autoplan ready` accordingly. Point handoff at a fresh artifact or refreshed authority file, not the current repo-root PLAN.md or ORCH_PLAN.md. Do not promote a future trigger-table row or M41 gate branch while `required_next_action` still points at the current planning artifact or the closeout still says implementation is gated. Recommend one honest next move with evidence and a concrete handoff, not just a milestone label."
