[workspace]
resolver = "3"
members = ["spec-core", "spec-cli"]

[workspace.package]
version = "0.5.3"
edition = "2024"
rust-version = "1.89.0"
authors = ["Spec Authors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/atomize-hq/spec"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml_bw = "2.5.4"
jsonschema = "0.29"
thiserror = "2.0"
anyhow = "1.0"
walkdir = "2.5"
clap = { version = "4.5", features = ["derive"] }
toml = "0.8"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
